name: Build Ghorob Ashura APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q ./*.zip -d extracted

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android
        working-directory: extracted/BEM_Messenger/client
        run: flutter create --platforms=android .

      - name: Install dependencies
        working-directory: extracted/BEM_Messenger/client
        run: flutter pub get

      - name: Build APK
        working-directory: extracted/BEM_Messenger/client
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ghorob-ashura-apk
          path: extracted/BEM_Messenger/client/build/app/outputs/flutter-apk/app-debug.apk
